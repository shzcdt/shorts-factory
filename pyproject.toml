[project]
name = "clip-pilot"
version = "0.1.0"
description = "Turn long videos into YouTube Shorts and auto-publish them."
requires-python = ">=3.11"
dependencies = [
    "PyYAML",
    "python-dotenv",
    "watchdog",
    "google-api-python-client",
    "google-auth-oauthlib",
    "APScheduler",
    "PySceneDetect",
    "opencv-python",
    "faster-whisper",
    "yt-dlp",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "types-PyYAML",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["clip_pilot*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
lint.select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["clip_pilot"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["src/clip_pilot"]

[[tool.mypy.overrides]]
module = ["scenedetect", "scenedetect.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["playwright.*"]
ignore_missing_imports = true
