paths:
  inbox: data/inbox
  staging: data/staging
  clips: data/clips
  review: data/review
  rejected: data/rejected
  published: data/published
  auth: auth
  logs: logs
  db: data/db.sqlite3

video:
  max_clip_seconds: 60
  fps: 30
  min_clip_seconds: 15
  ffprobe_path: ffprobe
  scene:
    detector: content
    threshold: 27.0
    min_scene_seconds: 3.0
  formatting:
    width: 1080
    height: 1920
    strategy: center_crop

watcher:
  scan_interval_seconds: 3
  settle_seconds: 2
  hash_chunk_mb: 4
  extensions: [.mp4, .mov, .mkv, .avi, .webm, .flv, .m4v]

logging:
  level: INFO
  format: "%(asctime)s %(levelname)s %(name)s %(message)s"

review:
  default_mode: manual

playwright:
  headless: false
  channel: msedge
  user_agent: ""
  timeout_seconds: 300
  slow_mo_ms: 0

upload:
  max_videos_per_day: 5
  delay_between_seconds: [45, 120]
